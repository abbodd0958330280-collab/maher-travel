<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">
<title>Maher Travel | لوحة الموظفين</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="luxury-bg"></div>
<div class="bg-overlay"></div>
<!-- Navigation -->
<nav class="navbar">
<div class="nav-container">
    <div class="logo">
        <div class="logo-icon">
            ✦
        </div>
        <div>
            <span class="logo-text">
                MAHER
            </span>
            <span class="logo-sub">
                TRAVEL
            </span>
        </div>
    </div>
    <div class="nav-links">
        <a
            href="index.html"
            class="nav-btn">
            ← الموقع الرئيسي
        </a>
    </div>
</div>
</nav>
<main class="container">
<!-- Staff Header -->
<section class="staff-header">
    <div>
        <span class="section-label">
            MAHER TRAVEL
        </span>
        <h2>
            لوحة الموظفين
        </h2>
        <p>
            إدارة ومتابعة طلبات الحجز
        </p>
    </div>
    <div class="staff-stats">
        <div class="stat-box">
            <span
                id="totalBookings"
                class="stat-count">
                0
            </span>
            <span class="stat-label">
                كل الحجوزات
            </span>
        </div>
        <div class="stat-box">
            <span
                id="newBookings"
                class="stat-count">
                0
            </span>
            <span class="stat-label">
                جديدة
            </span>
        </div>
        <div class="stat-box">
            <span
                id="confirmedBookings"
                class="stat-count">
                0
            </span>
            <span class="stat-label">
                مؤكدة
            </span>
        </div>
        <div class="stat-box">
            <span
                id="cancelledBookings"
                class="stat-count">
                0
            </span>
            <span class="stat-label">
                ملغاة
            </span>
        </div>
    </div>
</section>
<!-- Search -->
<section class="status-search">
    <div class="search-container">
        <input
            id="staffSearch"
            class="search-input"
            type="text"
            placeholder="🔎 ابحث برقم الحجز أو اسم المسافر أو الهاتف">
        <button
            id="refreshBookings"
            class="btn btn-primary">
            ↻ تحديث
        </button>
    </div>
</section>
<!-- Filters -->
<div class="staff-filters">
    <button
        class="filter-btn active"
        data-filter="all">
        الكل
    </button>
    <button
        class="filter-btn"
        data-filter="new">
        جديدة
    </button>
    <button
        class="filter-btn"
        data-filter="confirmed">
        مؤكدة
    </button>
    <button
        class="filter-btn"
        data-filter="rejected">
        مرفوضة
    </button>
    <button
        class="filter-btn"
        data-filter="cancelled">
        ملغاة
    </button>
</div>
<!-- Bookings -->
<section>
    <div
        id="staffBookings"
        class="bookings-list">
    </div>
</section>
</main>
<!-- Footer -->
<footer class="footer">
<div class="footer-logo">
    MAHER TRAVEL
</div>
<p>
    لوحة إدارة الحجوزات
</p>
<small>
    © 2026 Maher Travel
</small>
</footer>
<script>
const STORAGE_KEY = "maherTravelBookings";
let currentFilter = "all";
function getBookings() {
    try {
        return JSON.parse(
            localStorage.getItem(STORAGE_KEY)
        ) || [];
    } catch {
        return [];
    }
}
function saveBookings(bookings) {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(bookings)
    );
}
function escapeHTML(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
function statusName(status) {
    const names = {
        new: "طلب جديد",
        confirmed: "مؤكد",
        rejected: "مرفوض",
        cancelled: "ملغى"
    };
    return names[status] || "غير معروف";
}
function updateStats(bookings) {
    document.getElementById("totalBookings").textContent =
        bookings.length;
    document.getElementById("newBookings").textContent =
        bookings.filter(b => b.status === "new").length;
    document.getElementById("confirmedBookings").textContent =
        bookings.filter(b => b.status === "confirmed").length;
    document.getElementById("cancelledBookings").textContent =
        bookings.filter(b => b.status === "cancelled").length;
}
function renderBookings() {
    const container =
        document.getElementById("staffBookings");
    const search =
        document.getElementById("staffSearch")
        .value
        .trim()
        .toLowerCase();
    const bookings = getBookings();
    updateStats(bookings);
    let filtered = bookings.filter(booking => {
        const matchesFilter =
            currentFilter === "all" ||
            booking.status === currentFilter;
        const searchableText = [
            booking.id,
            booking.name,
            booking.phone,
            booking.pickup,
            booking.destination
        ]
        .join(" ")
        .toLowerCase();
        const matchesSearch =
            !search ||
            searchableText.includes(search);
        return matchesFilter && matchesSearch;
    });
    if (filtered.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                📭
                <br><br>
                لا توجد حجوزات مطابقة.
            </div>
        `;
        return;
    }
    container.innerHTML = filtered
        .slice()
        .reverse()
        .map(booking => `
        <article class="booking-row">
            <div class="booking-row-header">
                <div>
                    <div class="booking-ref">
                        ${escapeHTML(booking.id)}
                    </div>
                    <small>
                        ${escapeHTML(booking.createdAt || "")}
                    </small>
                </div>
                <span class="status-badge ${escapeHTML(booking.status)}">
                    ${statusName(booking.status)}
                </span>
            </div>
            <div class="booking-row-details">
                <div class="detail-item">
                    <span class="detail-label">
                        المسافر
                    </span>
                    <span class="detail-value">
                        ${escapeHTML(booking.name)}
                    </span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">
                        الهاتف
                    </span>
                    <span class="detail-value">
                        ${escapeHTML(booking.phone)}
                    </span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">
                        من
                    </span>
                    <span class="detail-value">
                        ${escapeHTML(booking.pickup)}
                    </span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">
                        إلى
                    </span>
                    <span class="detail-value">
                        ${escapeHTML(booking.destination)}
                    </span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">
                        التاريخ
                    </span>
                    <span class="detail-value">
                        ${escapeHTML(booking.date)}
                    </span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">
                        الوقت
                    </span>
                    <span class="detail-value">
                        ${escapeHTML(booking.time)}
                    </span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">
                        الركاب
                    </span>
                    <span class="detail-value">
                        ${escapeHTML(booking.passengers)}
                    </span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">
                        الخدمة
                    </span>
                    <span class="detail-value">
                        ${escapeHTML(booking.vehicle)}
                    </span>
                </div>
            </div>
            <div class="booking-row-actions">
                <select
                    class="status-select"
                    onchange="changeStatus('${escapeHTML(booking.id)}', this.value)">
                    <option
                        value="new"
                        ${booking.status === "new" ? "selected" : ""}>
                        طلب جديد
                    </option>
                    <option
                        value="confirmed"
                        ${booking.status === "confirmed" ? "selected" : ""}>
                        تأكيد الحجز
                    </option>
                    <option
                        value="rejected"
                        ${booking.status === "rejected" ? "selected" : ""}>
                        رفض الحجز
                    </option>
                    <option
                        value="cancelled"
                        ${booking.status === "cancelled" ? "selected" : ""}>
                        إلغاء الحجز
                    </option>
                </select>
                <button
                    class="btn btn-danger"
                    onclick="deleteBooking('${escapeHTML(booking.id)}')">
                    حذف
                </button>
            </div>
        </article>
    `)
    .join("");
}
function changeStatus(id, status) {
    const bookings = getBookings();
    const booking =
        bookings.find(item => item.id === id);
    if (!booking) return;
    booking.status = status;
    saveBookings(bookings);
    renderBookings();
}
function deleteBooking(id) {
    const confirmed =
        confirm(
            "هل أنت متأكد من حذف هذا الحجز؟"
        );
    if (!confirmed) return;
    const bookings =
        getBookings()
        .filter(item => item.id !== id);
    saveBookings(bookings);
    renderBookings();
}
document
    .getElementById("staffSearch")
    .addEventListener(
        "input",
        renderBookings
    );
document
    .getElementById("refreshBookings")
    .addEventListener(
        "click",
        renderBookings
    );
document
    .querySelectorAll(".filter-btn")
    .forEach(button => {
        button.addEventListener(
            "click",
            () => {
                document
                    .querySelectorAll(".filter-btn")
                    .forEach(btn =>
                        btn.classList.remove("active")
                    );
                button.classList.add("active");
                currentFilter =
                    button.dataset.filter;
                renderBookings();
            }
        );
    });
renderBookings();
</script>
</body>
</html>
